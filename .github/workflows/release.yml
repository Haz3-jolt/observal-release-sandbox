# Publish exact, validated commits from protected release/X.Y branches.

name: Release

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      target:
        description: "Release preparation commit SHA to validate and resume"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/observal/observal

jobs:
  # ── Preflight: detect and validate the release commit ─────
  preflight:
    name: Preflight checks
    if: github.repository == 'Haz3-jolt/observal-release-sandbox'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      channel: ${{ steps.version.outputs.channel }}
      python_version: ${{ steps.version.outputs.python_version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      promote_latest: ${{ steps.version.outputs.promote_latest }}
      target: ${{ steps.target.outputs.target }}
      is_release: ${{ steps.target.outputs.is_release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Resolve release target
        id: target
        env:
          MANUAL_TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Releases must run on release/X.Y, never main or a tag"
            exit 1
          fi
          if [ -n "$MANUAL_TARGET" ]; then
            [[ "$MANUAL_TARGET" =~ ^[0-9a-f]{40}$ ]] || exit 1
            TARGET="$MANUAL_TARGET"
          else
            TARGET=$(python3 tools/release.py --resolve-push \
              --before "$BEFORE" --after "$AFTER" --branch "$GITHUB_REF_NAME")
          fi
          if [ -z "$TARGET" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Validate release branch and manifest
        id: version
        if: steps.target.outputs.is_release == 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          python3 tools/release.py --validate-target "$TARGET" \
            --branch "$GITHUB_REF_NAME" --upstream origin >> "$GITHUB_OUTPUT"

  artifact-smoke:
    needs: preflight
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.target }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package and test the exact release tooling
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tar -czf /tmp/release-tooling.tgz tools tests/release
          mkdir /tmp/installed-release
          tar -xzf /tmp/release-tooling.tgz -C /tmp/installed-release
          cd /tmp/installed-release
          python3 tools/release.py --help
          python3 -m unittest discover -s tests/release -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-tooling-${{ needs.preflight.outputs.version }}
          path: /tmp/release-tooling.tgz
  tag:
    name: Create release tag
    needs: [preflight, artifact-smoke]
    if: needs.artifact-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          token: ${{ github.token }}

      - uses: chainguard-dev/actions/setup-gitsign@9d631658f55713e5f63ca0cc21ee168f81301fd9 # v1.6.30

      # setup-gitsign configures Git but still installs gitsign 0.16.1.
      - name: Install gitsign 0.17.1
        env:
          GITSIGN_VERSION: "0.17.1"
          GITSIGN_SHA256: "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae"
        run: |
          GITSIGN_BIN=$(mktemp)
          trap 'rm -f "$GITSIGN_BIN"' EXIT
          curl -fLsS \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64" \
            -o "$GITSIGN_BIN"
          printf '%s  %s\n' "$GITSIGN_SHA256" "$GITSIGN_BIN" | sha256sum -c
          install -m 0755 "$GITSIGN_BIN" "$HOME/.gitsign/gitsign"
          gitsign version

      - name: Create or verify tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ needs.preflight.outputs.target }}
          GITSIGN_ENABLE_SIGSTORE_GO: "true"
          GITSIGN_REKOR_MODE: "online"
          GITSIGN_REKOR_VERSION: "1"
        run: |
          TAG="v$VERSION"
          verify_tag() {
            for attempt in {1..5}; do
              if gitsign verify-tag "$TAG" \
                --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
                return 0
              fi
              [ "$attempt" -eq 5 ] && return 1
              echo "Tag verification attempt $attempt failed, retrying in 15 seconds"
              sleep 15
            done
          }
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$TARGET" ] || {
              echo "::error::$TAG points to a different commit"
              exit 1
            }
            if verify_tag; then
              echo "$TAG already points to the validated release commit and has a valid Sigstore signature"
              exit 0
            fi
            echo "::error::$TAG must have a valid signature; existing tags cannot be replaced"
            exit 1
          fi
          git tag -s "$TAG" -m "Release $TAG" "$TARGET"
          verify_tag
          git push origin "$TAG"

  github-release-smoke:
    needs: [preflight, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-tooling-${{ needs.preflight.outputs.version }}
          path: release
      - name: Publish, download, and verify synthetic release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          PROMOTE: ${{ needs.preflight.outputs.promote_latest }}
        run: |
          set -euo pipefail
          DIST_TAG=$(python3 -c 'import os; from tools.release import distribution_tag, version_tags; print(distribution_tag(os.environ["VERSION"], os.environ["CHANNEL"], version_tags()))')
          cd release
          sha256sum release-tooling.tgz > checksums.txt
          FLAGS=(--latest=false)
          [ "$CHANNEL" = stable ] || FLAGS+=(--prerelease)
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}" --title "Synthetic v$VERSION" --notes "Sandbox only, no production packages." release-tooling.tgz checksums.txt
          mkdir downloaded
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          (cd downloaded && sha256sum -c checksums.txt)
          if [ "$DIST_TAG" = latest ]; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest
          fi
